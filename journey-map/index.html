<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Searl Christmas Journey</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Layout: full-bleed 3D map; a journey card docks to the bottom, brand top-left, layer toggles top-right,
     waypoint stories float top-right (top, full width on phones). Single deliberate night-sky look. */
  :root {
    --night: #070D10;
    --glass: rgba(14, 23, 18, 0.82);
    --glass-line: rgba(221, 187, 108, 0.22);
    --ink: #ECE8DC;
    --muted: #A7A08D;
    --gold: #DDBB6C;
    --red: #E2677A;
    --pine: #79C596;
    --font-fest: "Mountains of Christmas", Georgia, serif;
    --font-body: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
    font-family: var(--font-body); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  #snow { position: fixed; inset: 0; pointer-events: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .lbl {
    position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
    color: var(--ink); text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.6);
    transition: opacity .35s; will-change: transform;
  }
  .lbl::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 0 2px rgba(7,13,16,.75);
  }
  .lbl.flip { flex-direction: row-reverse; }
  .lbl.minor { font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .lbl.minor::before { width: 5px; height: 5px; background: var(--ink); }
  .pin {
    position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap;
    font-size: 11.5px; font-weight: 600; color: var(--ink); opacity: 0; transition: opacity .4s;
    text-shadow: 0 1px 3px rgba(0,0,0,.95);
  }
  .pin i {
    width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gold); background: rgba(7,13,16,.6);
    box-sizing: border-box; flex: 0 0 auto;
  }
  .pin span { display: none; }
  .pin.on i { background: var(--gold); box-shadow: 0 0 0 0 rgba(221,187,108,.7); animation: ping 1.6s infinite; }
  .pin.on span { display: inline; }
  @keyframes ping { to { box-shadow: 0 0 0 14px rgba(221,187,108,0); } }

  .ui { position: fixed; z-index: 5; }
  .brand {
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
    pointer-events: none;
  }
  .brand h1 {
    margin: 0; font-family: var(--font-fest); font-weight: 700; font-size: clamp(24px, 4.2vw, 40px);
    line-height: 1; color: var(--ink); text-shadow: 0 2px 14px rgba(0,0,0,.7);
  }
  .brand p {
    margin: 4px 0 0; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--gold); text-shadow: 0 1px 6px rgba(0,0,0,.8);
  }
  .layers {
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
  }
  .chip {
    font: 600 12.5px/1 var(--font-body); color: var(--muted); background: var(--glass);
    border: 1px solid var(--glass-line); border-radius: 999px; padding: 8px 12px; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); white-space: nowrap;
  }
  .chip[aria-pressed="true"] { color: var(--night); background: var(--gold); border-color: var(--gold); }
  .chip:focus-visible, .btn:focus-visible, .dot:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .poi {
    top: calc(env(safe-area-inset-top, 0px) + 62px); right: max(16px, env(safe-area-inset-right, 0px));
    width: min(340px, calc(100vw - 32px)); background: var(--glass); border: 1px solid var(--glass-line);
    border-radius: 14px; padding: 12px 14px; display: grid; gap: 4px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 14px 40px rgba(0,0,0,.45);
    transition: opacity .4s, transform .4s; opacity: 0; transform: translateY(-6px); pointer-events: none;
  }
  .poi.show { opacity: 1; transform: none; }
  .poi .side { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
  .poi strong { font-size: 16px; line-height: 1.25; text-wrap: balance; }
  .poi p { margin: 0; font-size: 13.5px; color: var(--ink); opacity: .88; }

  .dock {
    left: 0; right: 0; bottom: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
    display: flex; justify-content: center; pointer-events: none;
  }
  .card {
    pointer-events: auto; width: 100%; max-width: 580px; background: var(--glass);
    border: 1px solid var(--glass-line); border-radius: 16px; padding: 14px 16px 12px;
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 18px 50px rgba(0,0,0,.45); display: grid; gap: 10px;
  }
  .card > * { min-width: 0; }
  .card-head { display: flex; gap: 12px; align-items: flex-start; }
  .mode {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: rgba(221,187,108,.12); color: var(--gold);
  }
  .mode[data-mode="train"] { background: rgba(226,103,122,.14); color: var(--red); }
  .mode[data-mode="car"] { background: rgba(121,197,150,.14); color: var(--pine); }
  .mode[data-mode="stay"] { background: rgba(236,232,220,.09); color: var(--ink); }
  .mode svg { width: 24px; height: 24px; }
  .txt { min-width: 0; display: grid; gap: 2px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
  .title { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
  .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .note { margin: 0; font-size: 14px; color: var(--ink); opacity: .86; max-width: 62ch; }
  .bar { height: 3px; border-radius: 2px; background: rgba(236,232,220,.12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--gold); }
  .controls { display: flex; align-items: center; gap: 8px; }
  .dots { display: flex; gap: 5px; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
  .dot {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--glass-line); background: transparent;
    color: var(--muted); font: 500 10.5px/1 var(--font-mono); cursor: pointer; padding: 0; flex: 0 0 auto;
  }
  .dot.done { background: rgba(221,187,108,.14); color: var(--ink); }
  .dot[aria-current="step"] { background: var(--gold); color: var(--night); border-color: var(--gold); }
  .btn {
    white-space: nowrap; font: 700 13.5px/1 var(--font-body); border-radius: 10px; padding: 10px 14px; cursor: pointer;
    border: 1px solid var(--glass-line); background: transparent; color: var(--ink);
  }
  .btn.primary { background: var(--gold); color: var(--night); border-color: var(--gold); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.icon { padding: 10px 12px; }

  #loading {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--night);
    transition: opacity .8s;
  }
  #loading div { text-align: center; display: grid; gap: 8px; padding-inline: 16px; }
  #loading strong { font-family: var(--font-fest); font-size: 34px; }
  #loading span { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; }
  #loading.gone { opacity: 0; pointer-events: none; }

  .credit {
    bottom: calc(env(safe-area-inset-bottom, 0px) + 2px); right: max(8px, env(safe-area-inset-right, 0px));
    font-size: 9.5px; color: rgba(236,232,220,.42); pointer-events: none;
  }
  @media (max-width: 640px) {
    .brand h1 { font-size: 24px; }
    .brand p { font-size: 10px; }
    .brand { max-width: calc(100vw - 150px); }
    .layers { flex-direction: column; align-items: flex-end; }
    .chip { padding: 7px 10px; font-size: 11.5px; }
    .poi { left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
           width: auto; top: calc(env(safe-area-inset-top, 0px) + 118px); padding: 10px 12px; }
    .poi strong { font-size: 15px; }
    .poi p { font-size: 13px; }
    .card { padding: 12px 12px 10px; gap: 8px; }
    .title { font-size: 16.5px; }
    .meta { font-size: 11px; }
    .note { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .mode { width: 34px; height: 34px; }
    .controls { flex-wrap: wrap; row-gap: 8px; }
    .dots { flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-block: 1px; }
    #pause { margin-left: auto; }
    .dots::-webkit-scrollbar { display: none; }
    .credit { display: none; }
  }
</style>
</head>
<body>

<div id="stage"></div>
<canvas id="snow"></canvas>
<div id="labels"></div>

<header class="ui brand" id="brand">
  <h1>Searl Family Christmas</h1>
  <p>Journey &middot; Dec 20&ndash;29, 2026</p>
</header>

<div class="ui layers" role="group" aria-label="Map layers">
  <button class="chip" id="tWinter" aria-pressed="true">Winter snow</button>
  <button class="chip" id="tClouds" aria-pressed="true">Clouds</button>
  <button class="chip" id="tStories" aria-pressed="true">Stories</button>
</div>

<aside class="ui poi" id="poi" aria-live="polite">
  <span class="side" id="poiSide"></span>
  <strong id="poiTitle"></strong>
  <p id="poiText"></p>
</aside>

<div class="ui dock" id="dock">
  <section class="card" aria-live="polite">
    <div class="card-head">
      <div class="mode" id="mode"></div>
      <div class="txt">
        <span class="eyebrow" id="eyebrow"></span>
        <h2 class="title" id="title"></h2>
        <span class="meta" id="meta"></span>
      </div>
    </div>
    <p class="note" id="note"></p>
    <div class="bar"><i id="prog"></i></div>
    <div class="controls">
      <div class="dots" id="dots"></div>
      <button class="btn icon" id="pause" aria-label="Pause">&#10074;&#10074;</button>
      <button class="btn icon" id="prev" aria-label="Previous leg">&larr;</button>
      <button class="btn primary" id="next">Next leg &rarr;</button>
    </div>
  </section>
</div>
<div class="ui credit">Imagery: contains modified Copernicus Sentinel-2 data &middot; Elevation: Mapzen/AWS Terrain Tiles &middot; Buildings: Overture Maps / OpenStreetMap &middot; Globe: NASA Blue Marble &middot; Lines: Natural Earth</div>

<div id="loading"><div><strong>Packing the sleigh&hellip;</strong><span id="loadmsg">Loading globe</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
'use strict';
const V3 = THREE.Vector3;
const R = 6371;                     // world units are kilometres
const D2R = Math.PI / 180;
const EXAG = 1.6;                   // vertical exaggeration for the terrain
const BHS = 1.3;                    // building height scale
const BB = { W: 9.9, E: 12.5, S: 46.9, N: 49.7 };          // detailed terrain patch
const IB = { W: 11.0, E: 11.8, S: 47.15, N: 47.45 };       // 30 m Innsbruck inset
const HW = 1280, HH = 1920;                                // height grid size
const GRID = [150, 240];                                   // 10 m detail-tile grid over BB
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const phone = () => innerWidth < 640;
const DEBUG = /debug/.test(location.search);

/* ---------- geo helpers ---------- */
function llv(lat, lon, h = 0, o = new V3()) {
  const p = lat * D2R, l = lon * D2R, r = R + h, c = Math.cos(p);
  return o.set(r * c * Math.sin(l), r * Math.sin(p), r * c * Math.cos(l));
}
function enu(v) {
  const up = v.clone().normalize();
  const east = new V3(up.z, 0, -up.x).normalize();
  const north = new V3().crossVectors(up, east);
  return { up, east, north };
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function lerpAngle(a, b, t) { const d = ((b - a + 540) % 360) - 180; return a + d * t; }

/* ---------- height field (filled after load) ---------- */
let HF = null;
function edgeFade(u, v) { return smooth(0, 0.03, Math.min(u, 1 - u, v, 1 - v)); }
function heightM(lat, lon) {
  const u = (lon - BB.W) / (BB.E - BB.W), v = (lat - BB.S) / (BB.N - BB.S);
  if (!HF || u <= 0 || u >= 1 || v <= 0 || v >= 1) return 0;
  const x = u * HW - .5, y = v * HH - .5, x0 = clamp(Math.floor(x), 0, HW - 2), y0 = clamp(Math.floor(y), 0, HH - 2);
  const fx = clamp(x - x0, 0, 1), fy = clamp(y - y0, 0, 1), i = y0 * HW + x0;
  return lerp(lerp(HF[i], HF[i + 1], fx), lerp(HF[i + HW], HF[i + HW + 1], fx), fy);
}
function terrainKm(lat, lon) {
  const u = (lon - BB.W) / (BB.E - BB.W), v = (lat - BB.S) / (BB.N - BB.S);
  if (u <= 0 || u >= 1 || v <= 0 || v >= 1) return 0;
  return heightM(lat, lon) / 1000 * EXAG * edgeFade(u, v) + 0.002;
}
function ground(lat, lon, lift = 0) { return llv(lat, lon, terrainKm(lat, lon) + lift); }

/* ---------- renderer / scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, phone() ? 2 : 1.75));
renderer.autoClear = false;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 1, 1e5);
scene.add(camera);
const uni = {
  uTime: { value: 0 }, uSun: { value: new V3(1, 0, 0) }, uAlt: { value: 10000 },
  uRes: { value: new THREE.Vector2(1, 1) }, uFocal: { value: 1 },
  uSnowLine: { value: 1300 }, uFrost: { value: 0.15 }, uWinter: { value: 1 },
  uRegionSun: { value: new V3(0, 1, 0) },
};

/* ---------- GLSL bits ---------- */
const NOISE = `
float hash(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
  return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm(vec3 p){ float a=.5, s=0.; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
`;
const LATLON = `
const float PI=3.14159265;
vec2 latlon(vec3 p){ vec3 n=normalize(p); return vec2(asin(n.y), atan(n.x,n.z)); }
`;
const HAZE = `
vec3 applyHaze(vec3 col, float dist, float alt){
  float fd=90.+alt*4.;
  return mix(col,vec3(.64,.73,.86),(1.-exp(-dist/fd))*.6*(1.-smoothstep(600.,2500.,alt)));
}`;

/* ---------- globe ---------- */
const tex = {};
const globeMat = new THREE.ShaderMaterial({
  uniforms: { ...uni, map: { value: null }, uBB: { value: new THREE.Vector4(BB.W, BB.E, BB.S, BB.N) } },
  vertexShader: `varying vec3 vPos; void main(){ vPos=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vPos,1.); }`,
  fragmentShader: LATLON + HAZE + `
    uniform sampler2D map; uniform vec3 uSun, uRegionSun; uniform vec4 uBB; uniform float uWinter, uAlt; varying vec3 vPos;
    void main(){
      vec2 ll=latlon(vPos); float lat=ll.x*180./PI, lon=ll.y*180./PI;
      if(lon>uBB.x+.004 && lon<uBB.y-.004 && lat>uBB.z+.004 && lat<uBB.w-.004) discard;
      vec3 c=texture2D(map, vec2(ll.y/(2.*PI)+.5, ll.x/PI+.5)).rgb;
      float land=step(c.b*1.1, max(c.r,c.g));
      float snow=uWinter*land*smoothstep(58.,68.,abs(lat))*smoothstep(.12,.3,c.r);
      c=mix(c, vec3(.86,.9,.95), snow*.8);
      float cl=dot(c,vec3(.2126,.7152,.0722)); c=mix(c,mix(vec3(cl),c,.62)*vec3(1.,.97,.95),uWinter*land);
      vec3 L=normalize(mix(uRegionSun,normalize(uSun),smoothstep(400.,2500.,uAlt)));
      vec3 n=normalize(vPos); float d=max(dot(n,L),0.);
      vec3 col=c*(.18+1.05*d);
      vec3 v=normalize(cameraPosition-vPos); vec3 h=normalize(v+L);
      col+= (1.-land)*vec3(.5,.6,.75)*pow(max(dot(n,h),0.),220.)*.18;
      col=applyHaze(col,length(cameraPosition-vPos),uAlt);
      gl_FragColor=vec4(col,1.); gl_FragColor=linearToOutputTexel(gl_FragColor);
    }`,
});
const globe = new THREE.Mesh(new THREE.SphereGeometry(R, 256, 128), globeMat);
scene.add(globe);

const atmo = new THREE.Mesh(new THREE.SphereGeometry(R * 1.022, 128, 64), new THREE.ShaderMaterial({
  uniforms: uni, side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN=normalize(normalMatrix*normal); vec4 p=modelViewMatrix*vec4(position,1.); vP=p.xyz; gl_Position=projectionMatrix*p; }`,
  fragmentShader: `uniform float uAlt; varying vec3 vN; varying vec3 vP;
    void main(){ float i=pow(clamp(.72+dot(vN,normalize(vP)),0.,1.),4.);
      float f=smoothstep(150.,1500.,uAlt);
      gl_FragColor=vec4(vec3(.35,.6,1.)*i*1.6*f,1.); gl_FragColor=linearToOutputTexel(gl_FragColor); }`,
}));
scene.add(atmo);

const cloudShell = new THREE.Mesh(new THREE.SphereGeometry(R + 9, 192, 96), new THREE.ShaderMaterial({
  uniforms: { ...uni, uOn: { value: 1 } }, transparent: true, depthWrite: false,
  vertexShader: `varying vec3 vPos; void main(){ vPos=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*viewMatrix*vec4(vPos,1.); }`,
  fragmentShader: NOISE + LATLON + `uniform float uTime,uAlt,uOn; uniform vec3 uSun; varying vec3 vPos;
    void main(){
      vec3 n=normalize(vPos); vec2 ll=latlon(vPos);
      vec3 q=n*5.+vec3(uTime*.004,0.,uTime*.002);
      float w=fbm(q*1.0+fbm(q*2.)*1.2);
      float band=.55+.25*sin(ll.x*3.);
      vec2 d=vec2((ll.y*180./PI-11.2)*.67,(ll.x*180./PI-48.2));
      float clear=smoothstep(2.5,7.,length(d));
      float a=smoothstep(.5,.78,w*band+.18)*(.25+.75*clear);
      a*=smoothstep(250.,900.,uAlt)*uOn;
      float lit=.35+.75*max(dot(n,normalize(uSun)),0.);
      gl_FragColor=vec4(vec3(1.)*lit,a*.85); gl_FragColor=linearToOutputTexel(gl_FragColor);
    }`,
}));
scene.add(cloudShell);

let stars;
{
  const g = new THREE.BufferGeometry(), n = 2500, p = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new V3().randomDirection().multiplyScalar(60000); p.set([v.x, v.y, v.z], i * 3); }
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcfd8ff, size: 1.6, sizeAttenuation: false, transparent: true, depthWrite: false }));
  stars.frustumCulled = false; scene.add(stars);
}

/* ---------- regional terrain (+ 10 m detail tiles near the routes) ---------- */
const terrainMat = new THREE.ShaderMaterial({
  uniforms: {
    ...uni, map: { value: null }, ibk: { value: null }, earth: { value: null }, hmap: { value: null },
    det: { value: null }, detIdx: { value: null }, uDetAtlas: { value: new THREE.Vector2(32, 1) }, uDetOn: { value: 0 },
    uBB: { value: new THREE.Vector4(BB.W, BB.E, BB.S, BB.N) }, uIB: { value: new THREE.Vector4(IB.W, IB.E, IB.S, IB.N) },
    uTexel: { value: new THREE.Vector2(1 / HW, 1 / HH) },
  },
  vertexShader: `

  async function flight(p, key, end, pois = []) {
    const a = p.p[0].clone().normalize(), b = p.p[p.p.length - 1].clone().normalize();
    const mid = a.clone().add(b).normalize().multiplyScalar(R);
    const fd = clamp(p.groundKm * 1.25, 1200, 11000) * fit;
    if (!await flyTo({ target: mid, dist: fd, tilt: 12, heading: 0 })) return;
    const T = reduceMotion ? .01 : clamp(3 + p.groundKm / 1400, 4, 8.5) + pois.length * 1.8;
    const stops = placePois(p, pois), m0 = mid.clone(), bR = b.clone().multiplyScalar(R);
    const ok = await anim(T, t => {
      const e = ease(t), d = e * p.len;
      ROUTES[key].set('uReveal', d); drawPlane(plane, p, d);
      cam.target.copy(m0).lerp(bR, e * .25).normalize().multiplyScalar(R);
      cam.dist = fd * (1 - .12 * e); state.progress = t * .8;
      const near = stops.find(st => Math.abs(st.s - d) < p.len * .09);
      showPoi(near ? near.p : null, near ? near.side : '');
    });
    showPoi(null);
    if (!ok) return;
    plane.visible = false;
    await flyTo(end); state.progress = 1;
  }
  async function groundLeg(path, key, kind, o = {}) {
    const draw = kind === 'train' ? drawTrain : drawVan;
    const tan0 = new V3(); path.at(0.5, new V3(), tan0);
    const h0 = headingOf(path.p[0], tan0);
    setPins(o.pois || []);
    const stops = placePois(path, o.pois || []);
    if (!await flyTo({ target: path.p[0].clone(), dist: 7 * fitClose, tilt: 62, heading: h0 })) return;
    const T0 = reduceMotion ? .01 : clamp(path.len / 9, 5, 16);
    const sch = schedule(path.len, T0, state.stories ? stops : []);
    let hd = h0, look = 0;
    const camTarget = new V3();
    const ok = await anim(reduceMotion ? .01 : sch.T, t => {
      const d = sch.s(t), pos = draw(path, d);
      ROUTES[key].set('uReveal', path === ROUTES[key].path ? d : ROUTES[key].path.len);
      path.at(Math.min(path.len, d + 2), _tp, _tan);
      const nr = sch.near(d), k = nr.k;
      let want = headingOf(pos, _tan);
      if (nr.st && nr.st.p.lat && k > .05) {               // turn the camera toward the waypoint
        nr.st.p.v = nr.st.p.v || ground(nr.st.p.lat, nr.st.p.lon, .03);
        want = lerpAngle(want, headingOf(pos, nr.st.p.v.clone().sub(pos).normalize()), .55 * k);
        camTarget.copy(pos).lerp(nr.st.p.v, .35 * k);
      } else camTarget.copy(pos);
      hd = lerpAngle(hd, want, .05); look = lerp(look, k, .05);
      cam.target.copy(camTarget); cam.heading = hd;
      cam.dist = (6.5 + 9 * Math.sin(Math.PI * t) * (1 - look)) * fitClose; cam.tilt = 64 - 6 * Math.sin(Math.PI * t);
      showPoi(k > .35 && nr.st ? nr.st.p : null, nr.st ? nr.st.side : '');
      state.progress = t * (o.roundTrip ? .45 : .85);
    });
    showPoi(null);
    if (!ok) return;
    if (o.roundTrip) {
      if (!await tour(o.tour, o.stop, 0, true)) return;
      const back = o.roundTrip, mid = back.p[0].clone().add(back.p[back.p.length - 1]).multiplyScalar(.5);
      setPins([]);
      if (!await flyTo({ target: mid, dist: (back.len * 1.15 + 20) * fit, tilt: 30, heading: 0 }, 2)) return;
      if (!await anim(reduceMotion ? .01 : 4, t => { draw(back, ease(t) * back.len); state.progress = .6 + t * .4; })) return;
      hideVehicles();
      await flyTo(munichHome(), 2);
    } else {
      hideVehicles();
      await flyTo(o.end, 2.4);
      orbitIdle(.8);
    }
    state.progress = 1;
  }
  async function homeward() {
    const a = P.mucDen, b = P.denIct, c = P.mucOrd, d2 = P.ordIct;
    if (!await flyTo({ target: llv(52, -40), dist: 11500 * fit, tilt: 8, heading: 0 })) return;
    let ok = await anim(reduceMotion ? .01 : 8, t => {
      const e = ease(t);
      ROUTES.mucDen.set('uReveal', e * a.len); ROUTES.mucOrd.set('uReveal', e * c.len);
      drawPlane(plane, a, e * a.len); drawPlane(plane2, c, e * c.len); state.progress = t * .6;
    });
    if (!ok) return;
    if (!await flyTo(far(view(39.2, -96, 2600, 15, 0)), 2.5)) return;
    ok = await anim(reduceMotion ? .01 : 4, t => {
      const e = ease(t);
      ROUTES.denIct.set('uReveal', e * b.len); ROUTES.ordIct.set('uReveal', e * d2.len);
      drawPlane(plane, b, e * b.len); drawPlane(plane2, d2, e * d2.len); state.progress = .6 + t * .4;
    });
    if (!ok) return;
    hideVehicles();
    await flyTo(far(view(PL.ict.lat, PL.ict.lon, 1400, 20, 0)), 2);
  }
}
// Visit each stop in turn with its story, then settle back on the view of the whole place.
async function tour(stops, base, rate = 1, partOfLeg = false) {
  hideVehicles(); setPins(stops);
  if (!await flyTo(base, partOfLeg ? 2.4 : undefined)) return false;
  for (let i = 0; i < stops.length; i++) {
    const p = stops[i];
    if (!await flyTo(view(p.lat, p.lon, p.d || 1.1, 60, (cam.heading + 35) % 360), 2)) return false;
    showPoi(p, `Stop ${i + 1} of ${stops.length}`);
    if (!await anim(reduceMotion ? 3 : 5.5, t => { cam.heading += .06 * clock.speed; state.progress = (i + t) / stops.length * (partOfLeg ? .15 : 1) + (partOfLeg ? .45 : 0); })) return false;
  }
  showPoi(null);
  if (!await flyTo(base, 2)) return false;
  if (!partOfLeg) { state.progress = 1; orbitIdle(rate); }
  return true;
}
function orbitIdle(rate) { state.orbit = reduceMotion ? 0 : rate; }

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function renderUI() {
  const s = STEPS[state.step];
  $('mode').dataset.mode = s.mode; $('mode').innerHTML = ICON[s.mode];
  $('eyebrow').textContent = s.eyebrow; $('title').textContent = s.title; $('meta').textContent = s.meta; $('note').textContent = s.note;
  $('prev').disabled = state.step === 0;
  $('next').textContent = state.step === STEPS.length - 1 ? 'Start over ↺' : (phone() ? 'Next →' : 'Next leg →');
  [...$('dots').children].forEach((d, i) => {
    d.classList.toggle('done', i < state.step);
    if (i === state.step) { d.setAttribute('aria-current', 'step'); d.scrollIntoView({ block: 'nearest', inline: 'center' }); } else d.removeAttribute('aria-current');
  });
  viewKey = ''; updateViewOffset();
}
function setRouteStyles(i) {
  const active = new Set(STEPS[i].routes);
  const done = new Set(); STEPS.slice(0, i).forEach(s => s.routes.forEach(r => done.add(r)));
  for (const [k, r] of Object.entries(ROUTES)) {
    if (active.has(k)) { r.set('uAlpha', .95); r.set('uReveal', 0); }
    else if (done.has(k)) { r.set('uAlpha', .7); r.set('uReveal', r.path.len); }
    else { r.set('uAlpha', i === 0 || i === STEPS.length - 1 ? .75 : .2); r.set('uReveal', r.path.len); }
  }
}
function setPaused(p) {
  clock.speed = p ? 0 : 1;
  $('pause').innerHTML = p ? '&#9654;' : '&#10074;&#10074;';
  $('pause').setAttribute('aria-label', p ? 'Play' : 'Pause');
}
async function go(i) {
  token.dead = true; token = { dead: false };
  setPaused(false);
  state.step = (i + STEPS.length) % STEPS.length; state.progress = 0; state.orbit = 0; state.veil = 0;
  const s = STEPS[state.step];
  state.snowTarget = s.snow ? 1 : 0;
  hideVehicles(); setRouteStyles(state.step); renderUI(); showPoi(null); setPins([]);
  try { if (location.hash !== '#' + s.id) history.replaceState(null, '', '#' + s.id); } catch (e) {}
  usePack(s.pack);                      // detail loads while the camera is still flying in
  await s.run(s);
}
function buildDots() {
  STEPS.forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'dot'; b.textContent = i === 0 ? '★' : i === STEPS.length - 1 ? '⌂' : String(i);
    b.setAttribute('aria-label', s.title); b.title = s.title; b.onclick = () => go(i);
    $('dots').appendChild(b);
  });
}
addEventListener('hashchange', () => {
  const h = location.hash.slice(1), i = STEPS.findIndex(s => s.id === h || s.day === h);
  if (i >= 0 && i !== state.step) go(i);
});
$('next').onclick = () => go(state.step + 1);
$('prev').onclick = () => go(state.step - 1);
$('pause').onclick = () => setPaused(clock.speed !== 0);
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === 'ArrowRight') go(state.step + 1); else if (e.key === 'ArrowLeft') go(state.step - 1);
  else if (e.key === ' ') { e.preventDefault(); setPaused(clock.speed !== 0); }
});
function toggle(btn, key, after) {
  btn.onclick = () => { state[key] = state[key] ? 0 : 1; btn.setAttribute('aria-pressed', state[key] ? 'true' : 'false'); after && after(); };
}
toggle($('tWinter'), 'winter'); toggle($('tClouds'), 'clouds'); toggle($('tStories'), 'stories', () => { if (!state.stories) showPoi(null); });

/* ---------- pointer: drag to look around, wheel / pinch to zoom ---------- */
const pts = new Map(); let pinch0 = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); state.orbit = 0; });
cv.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) cam.dist = clamp(cam.dist * pinch0 / d, .6, 30000); pinch0 = d; return;
  }
  if (cam.dist > 600) {
    const f = enu(cam.target), k = cam.dist / R * .0022;
    cam.target.applyAxisAngle(f.north, -dx * k).applyAxisAngle(f.east, dy * k);
  } else { cam.heading -= dx * .25; cam.tilt = clamp(cam.tilt - dy * .2, 0, 80); }
});
const up = e => { pts.delete(e.pointerId); pinch0 = 0; };

cv.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * Math.exp(e.deltaY * .0012), .6, 30000); }, { passive: false });

/* ---------- frame loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h;
  uni.uRes.value.set(w * renderer.getPixelRatio(), h * renderer.getPixelRatio());
  uni.uFocal.value = uni.uRes.value.y / (2 * Math.tan(camera.fov * D2R / 2));
  snowCv.width = w * devicePixelRatio; snowCv.height = h * devicePixelRatio;
  viewKey = ''; updateViewOffset();
}
addEventListener('resize', resize); resize();
const bgSpace = new THREE.Color(0x03060c), bgSky = new THREE.Color(0x9fb4cc), bg = new THREE.Color(), snowWhite = new THREE.Color(0xf2f5f8);
let last = performance.now(), winterV = 1;
function frame(now) {
  const dt = Math.min(DEBUG ? 1 : .1, (now - last) / 1000); last = now;
  clock.t += dt * clock.speed;
  uni.uTime.value += dt * clock.speed;
  if (state.orbit) cam.heading += state.orbit * dt * 2.2 * clock.speed;
  updateViewOffset();
  const alt = applyCam(); uni.uAlt.value = alt;
  const right = new V3().setFromMatrixColumn(camera.matrixWorld, 0), cup = new V3().setFromMatrixColumn(camera.matrixWorld, 1);
  uni.uSun.value.copy(camera.position).normalize().multiplyScalar(R).addScaledVector(right, -R * .9).addScaledVector(cup, R * .7).normalize();
  keyLight.position.copy(cam.target).addScaledVector(uni.uRegionSun.value, 50);
  keyLight.target.position.copy(cam.target);
  winterV = lerp(winterV, state.winter, .08);
  uni.uWinter.value = winterV; uni.uSnowLine.value = lerp(3400, 1300, winterV); uni.uFrost.value = .15 * winterV;
  for (const r of roofMats) r.m.color.copy(r.base).lerp(snowWhite, .7 * winterV);
  const du = terrainMat.uniforms.uDetOn; if (terrainMat.uniforms.det.value) du.value = Math.min(1, du.value + dt * 1.5);
  if (state.packMesh) { const f = state.packMesh.material.uniforms.uFade; f.value = Math.min(1, f.value + dt * 1.2); }
  landmarkGroup.visible = cam.dist < 60;
  cloudShell.material.uniforms.uOn.value = lerp(cloudShell.material.uniforms.uOn.value, state.clouds, .1);
  stars.material.opacity = smooth(300, 2500, alt);
  bg.copy(bgSky).lerp(bgSpace, smooth(25, 900, alt)); renderer.setClearColor(bg);
  updateSprites(dt, alt);
  veilMat.uniforms.uCover.value = state.veil; veilMat.uniforms.uOff.value.copy(state.veilOff);
  state.snow = lerp(state.snow, state.snowTarget * winterV * (cam.dist < 40 ? 1 : 0), .04);
  drawSnow(dt * clock.speed, state.snow);
  updateLabels(); updatePins();
  $('prog').style.width = (state.progress * 100).toFixed(1) + '%';
  renderer.clear(); renderer.render(scene, camera);
  if (state.veil > .002) renderer.render(veilScene, veilCam);
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function loadTex(url, srgb = true) {
  return new Promise((res, rej) => new THREE.TextureLoader().load(url, t => {
    if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); res(t);
  }, undefined, rej));
}
function loadHeight(url) {
  return new Promise((res, rej) => {
    const img = new Image(); img.onload = () => {
      const c = document.createElement('canvas'); c.width = HW; c.height = HH; const x = c.getContext('2d', { willReadFrequently: true });
      x.drawImage(img, 0, 0); const d = x.getImageData(0, 0, HW, HH).data;
      const f = new Float32Array(HW * HH), half = new Uint16Array(HW * HH);
      for (let j = 0; j < HH; j++) {            // flip rows so row 0 is the southern edge (v = 0)
        const src = (HH - 1 - j) * HW;
        for (let i = 0; i < HW; i++) { const k = (src + i) * 4, h = d[k] * 256 + d[k + 1]; f[j * HW + i] = h; half[j * HW + i] = THREE.DataUtils.toHalfFloat(h); }
      }
      const t = new THREE.DataTexture(half, HW, HH, THREE.RedFormat, THREE.HalfFloatType);
      t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true;
      res({ f, t });
    };
    img.onerror = rej; img.src = url;
  });
}
(async () => {
  const msg = $('loadmsg');
  try {
    msg.textContent = 'Loading globe';
    tex.earth = await loadTex('assets/earth.jpg');
    globeMat.uniforms.map.value = tex.earth; terrainMat.uniforms.earth.value = tex.earth;
    msg.textContent = 'Loading Alpine terrain';
    const [region, ibk, hm, geo] = await Promise.all([
      loadTex('assets/region.jpg'), loadTex('assets/innsbruck.jpg'), loadHeight('assets/region-height.png'),
      fetch('assets/geo.json').then(r => r.json()),
    ]);
    HF = hm.f; terrainMat.uniforms.map.value = region; terrainMat.uniforms.ibk.value = ibk; terrainMat.uniforms.hmap.value = hm.t;
    buildTerrain(); buildSprites(); buildLandmarks(); buildJourney(geo); buildDots();
    requestAnimationFrame(frame);
    $('loading').classList.add('gone');
    if (DEBUG) window.__dbg = { set: (la, lo, d, t, h) => { token.dead = true; token = { dead: false }; state.orbit = 0; state.veil = 0; Object.assign(cam, view(la, lo, d, t, h)); }, cam, view, go, state, usePack, clock, setPaused, POI, scene };
    const h = location.hash.slice(1), start = Math.max(0, STEPS.findIndex(s => s.id === h || s.day === h));
    go(start);
  } catch (err) {
    console.error(err);
    msg.textContent = 'The map data did not load. Check your connection and reload the page.';
  }
})();
